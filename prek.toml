[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-format",
    name = "Python formatting",
    entry = "ruff format",
    language = "system",
    files = "\\.py$",
    pass_filenames = true,
  },
  {
    id = "ruff-lint",
    name = "Python linting",
    entry = "ruff check",
    language = "system",
    files = "\\.py$",
    pass_filenames = true,
  },
  {
    id = "prettier-frontend",
    name = "Frontend formatting",
    entry = "npx prettier --write",
    language = "system",
    files = "\\.(ts|tsx|js|jsx|json|css|md)$",
    pass_filenames = true,
  },
]
